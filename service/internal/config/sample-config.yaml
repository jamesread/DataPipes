# DataPipes sample configuration (built-in fallback).
#
# Used automatically when ~/.datapipes-config.yaml is not found.
# To customize permanently:
#   cp sample-config.yaml ~/.datapipes-config.yaml
# Or point at a file:
#   DATAPIPES_CONFIG=/path/to/config.yaml
#
# Docs: https://github.com/jamesread/data-cleaner

network:
  bindproxy: ":8080"

csv:
  header: true

# Connections define extract sources (type: csv) and load destinations
# (type: mysql, firefly_iii, or the implicit download_csv).
connections:
  sample_csv:
    type: csv
    import_directory: ./import
    columns:
      date: 0
      description: 1
      value: 2
      balance: 3

  # mysql-dw:
