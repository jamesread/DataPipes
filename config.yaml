# Local / example DataPipes configuration.
#
# Prefer copying the built-in sample for a full starter:
#   # (sample is embedded; see service/internal/config/sample-config.yaml)
#   cp service/internal/config/sample-config.yaml ~/.datapipes-config.yaml
#
# Or load this file explicitly:
#   DATAPIPES_CONFIG=/path/to/config.yaml

network:
  bindproxy: ":8080"

csv:
  header: true

connections:
  sample_csv:
    type: csv
    import_directory: ./import
    columns:
      date: 0
      description: 1
      value: 2
      balance: 3

jobs:
  sample:
    extract: sample_csv
    load: download_csv
    transform:
      - date_normalize:
          column: date
